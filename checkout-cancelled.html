<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout cancelled · Tapioca</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=DM+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
:root{--ink:#3D3558;--ink-soft:#7f7393;--accent:#B39DDB;--accent-dark:#7653b3}
html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif;color:var(--ink);background:#F5F0FF}
body{min-height:100vh;overflow:hidden}
.scene{position:fixed;inset:0;background:
radial-gradient(circle at 14% 16%,rgba(209,196,233,.92) 0 8%,transparent 25%),
radial-gradient(circle at 88% 80%,rgba(179,157,219,.46) 0 10%,transparent 30%),
linear-gradient(145deg,#f8f4ff,#ebe4f3);}
.ghost{position:absolute;left:50%;top:50%;width:min(980px,92vw);height:min(620px,78vh);transform:translate(-50%,-50%);border-radius:42px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.58);box-shadow:0 32px 90px rgba(70,53,92,.12)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(44,37,58,.43);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer}
.card{width:min(500px,100%);border-radius:32px;padding:30px;position:relative;cursor:default;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(239,232,248,.75));border:1px solid rgba(255,255,255,.88);box-shadow:0 30px 88px rgba(48,31,64,.22),inset 0 1px 0 rgba(255,255,255,.95)}
.close{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.54);color:var(--ink);font-size:19px;cursor:pointer}
.eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(179,157,219,.23);font-size:.76rem;font-weight:800;color:var(--accent-dark);margin-bottom:18px}
.icon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(179,157,219,.18);border:1px solid rgba(149,117,205,.23);font-weight:900;font-size:22px;color:var(--accent-dark);margin-bottom:18px}
h1{font-family:'Comfortaa',sans-serif;font-size:2rem;line-height:1.15;margin:0 48px 10px 0;letter-spacing:-.025em}
p{margin:0;color:var(--ink-soft);font-size:.98rem;line-height:1.65}
.hint{margin-top:22px;padding-top:17px;border-top:1px solid rgba(91,68,117,.11);font-size:.79rem;color:#9a8da8}
.app-fallback{display:none;margin-top:15px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.43);font-size:.78rem;color:var(--ink-soft)}
@media(max-width:560px){.card{padding:27px 23px}h1{font-size:1.75rem}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="ghost"></div></div>
<div class="overlay" id="overlay">
  <main class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="eyebrow">subscription checkout</div>
    <div class="icon">↩</div>
    <h1 id="result-title">Checkout cancelled</h1>
    <p>No new subscription payment was completed.<br><br>You can return to Tapioca and choose a plan whenever you’re ready.</p>
    <div class="hint" id="hint">Click × or anywhere outside this card to return to Tapioca.</div>
    <div class="app-fallback" id="app-fallback">Your browser kept this tab open. You can close it and return to the Tapioca app.</div>
  </main>
</div>
<script>
const source=new URLSearchParams(location.search).get('source')||'web';
const overlay=document.getElementById('overlay');
const card=document.getElementById('card');
const closeButton=document.getElementById('close');
const hint=document.getElementById('hint');
const fallback=document.getElementById('app-fallback');

if(source==='app'){
  hint.textContent='Click × or anywhere outside this card to return to the Tapioca app.';
}

function dismissResult(){
  if(source==='app'){
    // Current released desktop builds open Stripe in the system browser and do not
    // register a web deep-link protocol. Closing the checkout tab is therefore the
    // safest available return behavior; if the browser blocks window.close(), show
    // a clear fallback instead of navigating the user away from the app workflow.
    window.close();
    setTimeout(()=>{fallback.style.display='block'},220);
    return;
  }
  location.replace('/');
}

overlay.addEventListener('click',dismissResult);
card.addEventListener('click',e=>e.stopPropagation());
closeButton.addEventListener('click',dismissResult);
addEventListener('keydown',e=>{if(e.key==='Escape')dismissResult()});
</script>
</body>
</html>
